name: Triggers
run-name: premier trigger

on:
  push:
    branches: 
    - aprendiendo-github-actions

  workflow_dispatch:
    inputs:
      lenguaje_favorito:
        description: 'lenguaje favorito'
        default: javascript
        required: true
      nombre:
        description: 'tu nombre'
        required: true
        default: juan

jobs:
  hola-mundo:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        
      - name: correr archivo
        run: node test-javascript.js

  
        
